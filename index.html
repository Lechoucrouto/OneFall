<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phaser Pixel Art Test</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #1a1a1a;
    }
    canvas {
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <script src="phaser.min.js"></script>
  <script>
    const config = {
      type: Phaser.AUTO,
      width: 768,
      height: 600,
      backgroundColor: '#2d2d2d',
      pixelArt: true, // stops the annoying ass fucking blurring of my pixel art
      scene: {
        preload() {
          // loads images
          this.load.image('p1', 'p1.png');
          this.load.image('grass', 'grass.png');
        },
        create() {
          // limit camera and physics to the tower
          const towerwidth = 8 * 96
          const towerheight = 50 * 96

          this.camera.main.setBounds(0, 0, towerwidth, towerheight)
          this.physics.world.setBounds(0, 0, towerwidth, towerheight)

          this.camera.main.startFollow(player, true)

          

          // Renders bobert robertson :) :thumbsup:!
          const player = this.add.sprite(400, 340, 'p1');
          player.setScale(3); // he bigger now

          // renders the grass and makes it big
          const grass = this.add.sprite(400, 434, 'grass');
          grass.setScale(3);

          // reanders text and makes it bouncy

          const text = this.add.text(400, 240, 'OneFall', {
            fontSize: '48px',
            color: '#ffffff',
            fontFamily: 'monospace'
          }).setOrigin(0.5);

          this.tweens.add({
            targets: text,
            y: 220,
            duration: 1000,
            ease: 'Sine.easeInOut',
            yoyo: true,
            repeat: -1
          });
        }
      }
    };

    new Phaser.Game(config);
  </script>
</body>
</html>
