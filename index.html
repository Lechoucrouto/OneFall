<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phaser Hello World</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #1a1a1a;
    }
  </style>
</head>
<body>
  <script src="phaser.min.js"></script>
  <script>
    const config = {
      type: Phaser.AUTO,
      width: 800,
      height: 600,
      backgroundColor: '#2d2d2d',
      scene: {
        create() {
          const text = this.add.text(400, 300, 'Hello, Phaser!', {
            fontSize: '48px',
            color: '#ffffff',
            fontFamily: 'sans-serif'
          }).setOrigin(0.5);

          // Gently bob the text up and down to verify the game loop is running
          this.tweens.add({
            targets: text,
            y: 260,
            duration: 1000,
            ease: 'Sine.easeInOut',
            yoyo: true,
            repeat: -1
          });
        }
      }
    };

    new Phaser.Game(config);
  </script>
</body>
</html>
