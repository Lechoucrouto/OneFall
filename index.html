<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phaser Pixel Art Test</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #1a1a1a;
    }
    canvas {
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <script src="phaser.min.js"></script>
  <script>
    const config = {
      type: Phaser.AUTO,
      width: 800,
      height: 600,
      backgroundColor: '#2d2d2d',
      pixelArt: true, // stops the annoying ass fucking blurring of my pixel art
      scene: {
        preload() {
          // loqds p1
          this.load.image('p1', 'p1.png');
        },
        create() {
          const text = this.add.text(400, 240, 'Hello, Phaser!', {
            fontSize: '48px',
            color: '#ffffff',
            fontFamily: 'monospace'
          }).setOrigin(0.5);

          // Renders bobert robertson :) :thumbsup:!
          const player = this.add.sprite(400, 340, 'p1');
          player.setScale(1); // he was so big so i made him smol

          this.tweens.add({
            targets: text,
            y: 220,
            duration: 1000,
            ease: 'Sine.easeInOut',
            yoyo: true,
            repeat: -1
          });

          this.tweens.add({
            targets: player,
            scaleX: "+=50",
            duration: 5000,
            ease: "Sine.easeInOut",
            yoyo: false,
            repeat: 0
          })
        }
      }
    };

    new Phaser.Game(config);
  </script>
</body>
</html>
